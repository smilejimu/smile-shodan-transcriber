name: debug-audio
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Drive file id"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APPS_URL: ${{ secrets.APPS_URL }}
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
      MODEL_DIR: models/sherpa-onnx-whisper-turbo
      DEBUG_ID: ${{ inputs.file_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: models
          key: whisper-turbo-v1
      - name: Prepare
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q sherpa-onnx soundfile numpy
          if [ ! -f "$MODEL_DIR/turbo-encoder.int8.onnx" ]; then
            mkdir -p models
            curl -sSL -o turbo.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-turbo.tar.bz2
            tar xjf turbo.tar.bz2 -C models
          fi
      - name: Inspect
        run: python3 debug_audio.py
